# ============================================================
# CLOUDREACH / AHMAD & CO. — CI/CD Pipeline
# Registry : Docker Hub  (DOCKER_USERNAME / DOCKER_PAT)
# Deploy   : VM via SSH  (VM_IP / VM_USERNAME / VM_PRIVATE_KEY)
# Checkout : AHMAD_PAT   (private repo access)
# Security : pinned action SHAs, secret scanning, Trivy
# ============================================================

name: 🚀 Build & Deploy Website

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Cancel in-progress runs on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ahmadco-website
  REGISTRY:   docker.io      # Docker Hub

jobs:
  # ──────────────────────────────────────────────────────────
  # Job 1 — Security & Validation
  # ──────────────────────────────────────────────────────────
  security:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.AHMAD_PAT }}   # Private repo access

      - name: Detect secrets in codebase (TruffleHog)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          extra_args: --only-verified
        continue-on-error: true

      - name: Block committed .env or secret files
        run: |
          echo "🔍 Scanning for committed secrets..."
          if git ls-files | grep -v "^\.env\.example$" | grep -E "^\.env$|^\.env\.|^secrets/" ; then
            echo "❌ CRITICAL: Secret files found in repository!"
            exit 1
          fi
          echo "✅ No secret files committed."

      - name: Validate required file structure
        run: |
          echo "📁 Checking required files..."
          test -f index.html   && echo "✅ index.html"   || { echo "❌ index.html missing";  exit 1; }
          test -d css          && echo "✅ css/"          || { echo "❌ css/ missing";        exit 1; }
          test -d js           && echo "✅ js/"           || { echo "❌ js/ missing";         exit 1; }
          test -f Dockerfile   && echo "✅ Dockerfile"    || { echo "❌ Dockerfile missing";  exit 1; }
          test -f .env.example && echo "✅ .env.example"  || echo "⚠️  .env.example missing"
          echo "✅ All required files present."

  # ──────────────────────────────────────────────────────────
  # Job 2 — Build & Push to Docker Hub
  # ──────────────────────────────────────────────────────────
  build:
    name: 🐳 Build & Push to Docker Hub
    runs-on: ubuntu-latest
    needs: security
    permissions:
      contents: read
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
      image-full: ${{ env.REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.AHMAD_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=AHMAD & CO. Website
            org.opencontainers.image.description=Enterprise Digital Transformation Agency — Dubai
            org.opencontainers.image.vendor=AHMAD & CO.
            org.opencontainers.image.url=https://ahmadco.tech

      - name: Build and push Frontend Docker image
        id: build-frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Build and push Backend Docker image
        id: build-backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: ${{ github.event_name == 'push' }}
          tags: |
            docker.io/${{ secrets.DOCKER_USERNAME }}/ahmadco-backend:latest
            docker.io/${{ secrets.DOCKER_USERNAME }}/ahmadco-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Images pushed summary
        if: github.event_name == 'push'
        run: |
          echo "📦 Docker Hub images pushed successfully:"
          echo "   Frontend : docker.io/${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest"
          echo "   Backend  : docker.io/${{ secrets.DOCKER_USERNAME }}/ahmadco-backend:latest"

  # ──────────────────────────────────────────────────────────
  # Job 3 — Test the container locally
  # ──────────────────────────────────────────────────────────
  test:
    name: 🧪 Test Container
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.AHMAD_PAT }}

      - name: Build test image
        run: docker build -t ${{ env.IMAGE_NAME }}:test .

      - name: Start container
        run: |
          docker run -d --name test-site -p 8080:80 \
            --read-only \
            --tmpfs /tmp \
            --tmpfs /var/cache/nginx \
            --tmpfs /var/run \
            ${{ env.IMAGE_NAME }}:test
          sleep 5

      - name: Health check
        run: |
          for i in {1..15}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080 || echo "000")
            echo "📡 Attempt $i — HTTP Status: $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "✅ Site is healthy!"
              break
            fi
            sleep 2
          done
          if [ "$STATUS" != "200" ]; then
            echo "❌ Health check failed!"
            docker logs test-site
            exit 1
          fi

      - name: Verify content
        run: |
          BODY=$(curl -s http://localhost:8080)
          echo "$BODY" | grep -qiE "CLOUDREACH|AHMAD"     && echo "✅ Brand name found"      || echo "❌ Brand name missing"
          echo "$BODY" | grep -qiE "Cloud & AI|DevOps"     && echo "✅ Hero/Services found"   || echo "❌ Services missing"
          echo "$BODY" | grep -qiE "ahmad.dstech@gmail.com|wa.me" && echo "✅ Contact info found"    || echo "⚠️  Contact info missing"

      - name: Check security headers
        run: |
          echo "🔒 Checking security headers..."
          HEADERS=$(curl -sI http://localhost:8080)
          echo "$HEADERS" | grep -qi "X-Frame-Options"        && echo "✅ X-Frame-Options"        || echo "⚠️  X-Frame-Options missing"
          echo "$HEADERS" | grep -qi "X-Content-Type-Options"  && echo "✅ X-Content-Type-Options"  || echo "⚠️  X-Content-Type-Options missing"
          echo "$HEADERS" | grep -qi "Content-Security-Policy" && echo "✅ CSP header"              || echo "⚠️  CSP missing"
          echo "$HEADERS" | grep -qi "Referrer-Policy"         && echo "✅ Referrer-Policy"          || echo "⚠️  Referrer-Policy missing"

      - name: Scan image for vulnerabilities (Trivy)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy image \
            --exit-code 0 \
            --severity HIGH,CRITICAL \
            --no-progress \
            ${{ env.IMAGE_NAME }}:test \
          || echo "⚠️  Trivy scan complete (non-blocking)"

      - name: Cleanup
        if: always()
        run: docker rm -f test-site || true

  # ──────────────────────────────────────────────────────────
  # Job 4 — Deploy to VM via SSH (SSH key auth)
  # Runs on push to main or master, after build + test pass
  # ──────────────────────────────────────────────────────────
  deploy:
    name: 🚢 Deploy to Production VM
    runs-on: ubuntu-latest
    needs: [build, test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: Deploy via SSH to VM
        uses: appleboy/ssh-action@v1.2.0
        with:
          host:     ${{ secrets.VM_IP }}
          username: ${{ secrets.VM_USERNAME }}
          key:      ${{ secrets.VM_PRIVATE_KEY }}
          port:     22
          timeout:  120s
          script: |
            set -e
            echo "🚀 Starting deployment — CLOUDREACH / AHMAD & CO. Website"
            echo "📅 Time: $(date)"

            # ── Login to Docker Hub ──────────────────────────
            echo "${{ secrets.DOCKER_PAT }}" | \
              docker login docker.io \
                -u ${{ secrets.DOCKER_USERNAME }} \
                --password-stdin
            echo "✅ Docker Hub authenticated"

            # ── Create shared docker network ─────────────────
            docker network create ahmadco-net 2>/dev/null || true

            # ── Deploy Backend (Port 8001) ───────────────────
            BACKEND_IMAGE="docker.io/${{ secrets.DOCKER_USERNAME }}/ahmadco-backend:latest"
            echo "📦 Pulling Backend: $BACKEND_IMAGE"
            docker pull "$BACKEND_IMAGE"
            docker stop ahmadco-backend 2>/dev/null || true
            docker rm   ahmadco-backend 2>/dev/null || true
            docker run -d \
              --name ahmadco-backend \
              --network ahmadco-net \
              --network-alias backend \
              --restart unless-stopped \
              -p 8001:3001 \
              -v leads_data:/app/data \
              "$BACKEND_IMAGE"
            echo "✅ Backend container deployed on port 8001"

            # ── Deploy Frontend (Port 8002) ──────────────────
            FRONTEND_IMAGE="docker.io/${{ secrets.DOCKER_USERNAME }}/ahmadco-website:latest"
            echo "📦 Pulling Frontend: $FRONTEND_IMAGE"
            docker pull "$FRONTEND_IMAGE"
            docker stop ahmadco-website 2>/dev/null || true
            docker rm   ahmadco-website 2>/dev/null || true
            docker run -d \
              --name ahmadco-website \
              --network ahmadco-net \
              --restart unless-stopped \
              --read-only \
              --tmpfs /tmp \
              --tmpfs /var/cache/nginx \
              --tmpfs /var/run \
              -p 8002:80 \
              "$FRONTEND_IMAGE"
            echo "✅ Frontend container deployed on port 8002"

            # ── Health checks on ports 8001 and 8002 ──────────
            sleep 4
            FRONTEND_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8002 || echo "000")
            BACKEND_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8001/ahmadcompany/health || echo "000")
            echo "📡 Frontend health (port 8002): $FRONTEND_STATUS"
            echo "📡 Backend health (port 8001): $BACKEND_STATUS"

            # ── Logout & cleanup ──────────────────────────────
            docker logout docker.io
            docker image prune -f --filter "until=24h"

            echo ""
            echo "🎉 ═══════════════════════════════════════"
            echo "   CLOUDREACH / AHMAD & CO. deployed!"
            echo "   Backend port  : 8001 (Status: $BACKEND_STATUS)"
            echo "   Frontend port : 8002 (Status: $FRONTEND_STATUS)"
            echo "   Host Nginx    : Port 80 untouched"
            echo "   Time          : $(date)"
            echo "═══════════════════════════════════════════"
